<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#6366f1">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <link rel="manifest" href="/static/manifest.json">
    <link rel="apple-touch-icon" href="/static/icons/icon-192.png">
    <title>Sprint - 历史记录</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <nav>
        <div class="logo">Sprint</div>
        <div class="nav-links">
            <a href="/">打卡</a>
            <a href="/history" class="active">历史</a>
            <a href="/insights">AI 洞察</a>
        </div>
    </nav>

    <main>
        <h1>学习历史</h1>

        <!-- 进度图表 -->
        <section class="chart-section">
            <h2>最近 30 天学习趋势</h2>
            <div id="chart" class="bar-chart"></div>
            <div id="chart-empty" class="empty-msg hidden">暂无数据，先去打个卡吧</div>
        </section>

        <!-- 记录列表 -->
        <section class="logs-section">
            <div id="logs"></div>
            <div id="logs-empty" class="empty-msg hidden">还没有记录</div>
        </section>
    </main>

    <script>
        async function loadLogs() {
            const res = await fetch('/api/logs');
            const logs = await res.json();
            const container = document.getElementById('logs');
            const empty = document.getElementById('logs-empty');

            if (!logs.length) {
                empty.classList.remove('hidden');
                return;
            }
            empty.classList.add('hidden');

            container.innerHTML = logs.map(l => `
                <div class="log-card">
                    <div class="log-header">
                        <span class="log-date">${l.date}</span>
                        <span class="log-mood">${l.mood}</span>
                    </div>
                    <div class="log-subject">${l.subject} · ${l.duration_hours}h</div>
                    <div class="log-content">${l.content}</div>
                </div>
            `).join('');
        }

        async function loadStats() {
            const res = await fetch('/api/stats');
            const stats = await res.json();
            const chart = document.getElementById('chart');
            const empty = document.getElementById('chart-empty');

            if (!stats.length) {
                empty.classList.remove('hidden');
                chart.classList.add('hidden');
                return;
            }
            empty.classList.add('hidden');
            chart.classList.remove('hidden');

            const maxHours = Math.max(...stats.map(s => s.total_hours), 1);
            chart.innerHTML = stats.map(s => {
                const pct = (s.total_hours / maxHours * 100).toFixed(1);
                return `
                    <div class="bar-group">
                        <div class="bar" style="height: ${pct}%"></div>
                        <div class="bar-label">${s.date.slice(5)}</div>
                        <div class="bar-value">${s.total_hours}h</div>
                    </div>
                `;
            }).join('');
        }

        loadLogs();
        loadStats();
    </script>
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/static/sw.js');
        }
    </script>
</body>
</html>
