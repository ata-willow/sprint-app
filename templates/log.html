<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#060e1a">
  <link rel="manifest" href="/static/manifest.json">
  <link rel="icon" href="/static/icon.png">
  <title>日志 · Sprint</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div class="page-container log-page-notebook">
    <h2 class="log-page-title animate-in">📝 航海日志</h2>

    <!-- 学习录入表单 - 带模式切换 -->
    <div class="log-notebook-card animate-in animate-delay-1">
      <div class="card-title">记录今日航行</div>

      <!-- 模式切换 -->
      <div class="log-mode-switch" id="log-mode-switch">
        <span class="mode-btn active" data-mode="study" id="mode-study">📚 学习</span>
        <span class="mode-btn" data-mode="mock" id="mode-mock">🎯 模考</span>
      </div>

      <!-- ====== 学习模式表单 ====== -->
      <form id="log-form" class="log-form">
        <div class="form-group">
          <label>日期</label>
          <input type="date" id="log-date" required>
        </div>
        <div class="form-group">
          <label>科目</label>
          <div class="subject-chips" id="subject-chips">
            <span class="subject-chip" data-subject="物理1">⚡ 物理1</span>
            <span class="subject-chip" data-subject="统计">📊 统计</span>
            <span class="subject-chip" data-subject="微积分BC">📐 微积分BC</span>
            <span class="subject-chip" data-subject="物理C">🔬 物理C</span>
            <span class="subject-chip" data-subject="托福">📝 托福</span>
            <span class="subject-chip" data-subject="其他">🔮 其他</span>
          </div>
          <input type="hidden" id="log-subject" required>
        </div>
        <div class="form-group">
          <label>学习时长（小时）</label>
          <input type="number" id="log-duration" step="0.5" min="0.5" max="12" placeholder="1.5" required>
        </div>
        <div class="form-group">
          <label>单元</label>
          <input type="text" id="log-unit" placeholder="如 第3单元">
        </div>
        <div class="form-group">
          <label>学习内容</label>
          <textarea id="log-content" rows="3" placeholder="今天学了什么..."></textarea>
        </div>
        <div class="form-group">
          <label>心情</label>
          <div class="mood-selector" id="mood-selector">
            <span class="mood-option" data-mood="😊">😊</span>
            <span class="mood-option" data-mood="🤔">🤔</span>
            <span class="mood-option" data-mood="😤">😤</span>
            <span class="mood-option" data-mood="😴">😴</span>
            <span class="mood-option" data-mood="😢">😢</span>
          </div>
        </div>
        <div class="form-group">
          <label>顿悟时刻（可选）</label>
          <textarea id="log-insight" rows="2" placeholder="突然想通的瞬间...⭐"></textarea>
        </div>
        <button type="submit" class="btn-submit">⚓ 记录航程</button>
      </form>

      <!-- ====== 模考模式表单 ====== -->
      <form id="mock-form" class="log-form" style="display:none">
        <div class="form-group">
          <label>日期</label>
          <input type="date" id="mock-date" required>
        </div>
        <div class="form-group">
          <label>科目</label>
          <div class="mock-subject-btns" id="mock-subject-btns">
            <span class="mock-subject-btn" data-subject="物理1">物理1</span>
            <span class="mock-subject-btn" data-subject="统计">统计</span>
            <span class="mock-subject-btn" data-subject="微BC">微BC</span>
            <span class="mock-subject-btn" data-subject="物C">物C</span>
            <span class="mock-subject-btn" data-subject="托福">托福</span>
          </div>
          <input type="hidden" id="mock-subject" required>
        </div>
        <div class="form-group">
          <label>模考名称</label>
          <input type="text" id="mock-exam-name" placeholder="如 Barron模考3">
        </div>
        <div class="form-group">
          <label>分数</label>
          <input type="number" id="mock-score" step="0.5" min="0" max="120" placeholder="95" required>
        </div>
        <button type="submit" class="btn-submit" style="background:linear-gradient(135deg, #2d9a85 0%, #40916c 100%);">🎯 记录模考</button>
      </form>
    </div>


    <!-- 顿悟时刻已移至航线页时间线 -->
  </div>

  <!-- 底部导航 - 4 tab -->
  <nav class="bottom-nav">
    <a href="/" class="nav-item">
      <svg class="nav-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 18c2.5-1.5 5-1.5 9-1.5s6.5 0 9 1.5"/>
        <path d="M12 3v13.5"/>
        <path d="M5 15c0-4 3-8 7-12 4 4 7 8 7 12"/>
      </svg>
      <span class="nav-label">航海</span>
    </a>
    <a href="/log" class="nav-item active">
      <svg class="nav-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round">
        <path d="M17 3c-2 1-4 3-5 6l-3 8 8-3c3-1 5-3 6-5"/>
        <path d="M9 17l-3 3"/>
        <path d="M14 8c1-1 2.5-1.5 4-1"/>
      </svg>
      <span class="nav-label">日志</span>
    </a>
    <a href="/route" class="nav-item">
      <svg class="nav-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="9"/>
        <polygon points="12,3 13.5,10.5 12,8 10.5,10.5" fill="currentColor" opacity="0.6"/>
        <polygon points="12,21 10.5,13.5 12,16 13.5,13.5" fill="currentColor" opacity="0.3"/>
        <line x1="12" y1="3" x2="12" y2="5"/>
        <line x1="12" y1="19" x2="12" y2="21"/>
        <line x1="3" y1="12" x2="5" y2="12"/>
        <line x1="19" y1="12" x2="21" y2="12"/>
      </svg>
      <span class="nav-label">航线</span>
    </a>
    <a href="/review" class="nav-item">
      <svg class="nav-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 19l7-7 3 3-7 7-3-3z"/>
        <path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18"/>
        <path d="M2 2l7.586 7.586"/>
        <circle cx="11" cy="11" r="2"/>
      </svg>
      <span class="nav-label">复盘</span>
    </a>
  </nav>

  <!-- Toast -->
  <div id="toast" class="toast"></div>

  <script>
    // 设置默认日期
    const today = new Date().toISOString().split('T')[0];
    document.getElementById('log-date').value = today;
    document.getElementById('mock-date').value = today;

    // ====== 模式切换 ======
    const modeStudy = document.getElementById('mode-study');
    const modeMock = document.getElementById('mode-mock');
    const logForm = document.getElementById('log-form');
    const mockForm = document.getElementById('mock-form');

    modeStudy.addEventListener('click', () => {
      modeStudy.classList.add('active');
      modeMock.classList.remove('active');
      logForm.style.display = '';
      mockForm.style.display = 'none';
    });

    modeMock.addEventListener('click', () => {
      modeMock.classList.add('active');
      modeStudy.classList.remove('active');
      mockForm.style.display = '';
      logForm.style.display = 'none';
    });

    // ====== 科目Chip选择器 - 学习 ======
    const logSubjectChips = document.querySelectorAll('#subject-chips .subject-chip');
    logSubjectChips.forEach(chip => {
      chip.addEventListener('click', () => {
        logSubjectChips.forEach(c => c.classList.remove('selected'));
        chip.classList.add('selected');
        document.getElementById('log-subject').value = chip.dataset.subject;
      });
    });

    // ====== 科目选择器 - 模考 ======
    const mockSubjectBtns = document.querySelectorAll('#mock-subject-btns .mock-subject-btn');
    mockSubjectBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        mockSubjectBtns.forEach(b => b.classList.remove('selected'));
        btn.classList.add('selected');
        const nameMap = {'微BC': '微积分BC', '物C': '物理C'};
        document.getElementById('mock-subject').value = nameMap[btn.dataset.subject] || btn.dataset.subject;
      });
    });

    // 心情选择器
    let selectedMood = '';
    document.querySelectorAll('.mood-option').forEach(el => {
      el.addEventListener('click', () => {
        document.querySelectorAll('.mood-option').forEach(o => o.classList.remove('selected'));
        el.classList.add('selected');
        selectedMood = el.dataset.mood;
      });
    });

    // Toast
    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 2500);
    }

    // 提交学习日志
    document.getElementById('log-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const subjectVal = document.getElementById('log-subject').value;
      if (!subjectVal) { showToast('请选择科目'); return; }
      const data = {
        date: document.getElementById('log-date').value,
        subject: subjectVal,
        duration_hours: document.getElementById('log-duration').value,
        content: document.getElementById('log-content').value,
        mood: selectedMood,
        insight: document.getElementById('log-insight').value || null,
        unit: document.getElementById('log-unit').value || null,
        log_type: 'study',
      };

      try {
        const res = await fetch('/api/log', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data),
        });
        const result = await res.json();
        if (result.ok) {
          showToast('⚓ 航程已记录！');
          document.getElementById('log-content').value = '';
          document.getElementById('log-insight').value = '';
          document.getElementById('log-duration').value = '';
          document.getElementById('log-unit').value = '';
          document.querySelectorAll('#subject-chips .subject-chip').forEach(c => c.classList.remove('selected'));
          document.getElementById('log-subject').value = '';
          document.querySelectorAll('.mood-option').forEach(o => o.classList.remove('selected'));
          selectedMood = '';
          setTimeout(() => location.reload(), 1500);
        } else {
          showToast('记录失败：' + (result.error || '未知错误'));
        }
      } catch (err) {
        showToast('网络错误，请重试');
      }
    });

    // 提交模考分数
    document.getElementById('mock-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const subject = document.getElementById('mock-subject').value;
      const score = document.getElementById('mock-score').value;
      const date = document.getElementById('mock-date').value;
      const examName = document.getElementById('mock-exam-name').value;

      if (!subject) { showToast('请选择科目'); return; }
      if (!score) { showToast('请输入分数'); return; }

      try {
        const res = await fetch('/api/mock-scores', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ subject, score: parseFloat(score), date, exam_name: examName || null }),
        });
        const result = await res.json();
        if (result.ok) {
          showToast('🎯 模考分数已记录！');
          document.getElementById('mock-score').value = '';
          document.getElementById('mock-exam-name').value = '';
          document.querySelectorAll('#mock-subject-btns .mock-subject-btn').forEach(b => b.classList.remove('selected'));
          document.getElementById('mock-subject').value = '';
          setTimeout(() => location.reload(), 1500);
        } else {
          showToast('记录失败：' + (result.error || '未知错误'));
        }
      } catch (err) {
        showToast('网络错误，请重试');
      }
    });

    // Service Worker
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/static/sw.js').catch(() => {});
    }
  </script>
</body>
</html>
