<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#6366f1">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <link rel="manifest" href="/static/manifest.json">
    <link rel="apple-touch-icon" href="/static/icons/icon-192.png">
    <title>Sprint - AI 洞察</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <nav>
        <div class="logo">Sprint</div>
        <div class="nav-links">
            <a href="/">打卡</a>
            <a href="/history">历史</a>
            <a href="/insights" class="active">AI 洞察</a>
        </div>
    </nav>

    <main>
        <h1>AI 学习洞察</h1>
        <p class="subtitle">基于最近 14 天的学习记录，AI 帮你分析学习模式和趋势</p>

        <div id="insight-card" class="insight-card loading">
            <div class="insight-icon">🧠</div>
            <div id="insight-text" class="insight-text">分析中...</div>
        </div>

        <button id="refresh-btn" class="btn-secondary" onclick="loadInsight()">重新分析</button>

        <!-- 最近记录摘要 -->
        <section class="recent-section">
            <h2>近期记录概览</h2>
            <div id="recent-logs"></div>
        </section>
    </main>

    <script>
        async function loadInsight() {
            const card = document.getElementById('insight-card');
            const text = document.getElementById('insight-text');
            card.className = 'insight-card loading';
            text.textContent = '分析中...';

            try {
                const res = await fetch('/api/insights');
                const data = await res.json();
                text.textContent = data.insight;
                card.className = 'insight-card';
            } catch (err) {
                text.textContent = '获取分析失败，请稍后再试';
                card.className = 'insight-card error';
            }
        }

        async function loadRecent() {
            const res = await fetch('/api/logs?limit=7');
            const logs = await res.json();
            const container = document.getElementById('recent-logs');
            container.innerHTML = logs.map(l => `
                <div class="mini-log">
                    <span class="mini-date">${l.date}</span>
                    <span class="mini-subject">${l.subject}</span>
                    <span class="mini-duration">${l.duration_hours}h</span>
                    <span class="mini-mood">${l.mood}</span>
                </div>
            `).join('');
        }

        loadInsight();
        loadRecent();
    </script>
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/static/sw.js');
        }
    </script>
</body>
</html>
