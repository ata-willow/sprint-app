<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="theme-color" content="#060e1a">
  <link rel="manifest" href="/static/manifest.json">
  <link rel="icon" href="/static/icon.png">
  <title>复盘 · Sprint</title>
  <link rel="stylesheet" href="/static/style.css?v=5">
</head>
<body>
  <div class="page-container">
    <h2 class="animate-in" style="color:var(--gold);font-family:var(--font-serif);letter-spacing:2px;margin-bottom:16px;">🔖 复盘</h2>

    <!-- 月度日历 + 月度目标（合并卡片） -->
    <div class="card animate-in animate-delay-1" id="calendar-card">
      <div class="calendar-header">
        <button class="cal-nav-btn" id="cal-prev" onclick="changeMonth(-1)">◀</button>
        <span class="cal-title" id="cal-title"></span>
        <button class="cal-nav-btn" id="cal-next" onclick="changeMonth(1)">▶</button>
      </div>
      <!-- 星期标签 -->
      <div class="cal-weekdays">
        <span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span><span>日</span>
      </div>
      <!-- 日历网格 -->
      <div class="cal-grid" id="cal-grid">
        <div class="loading"><div class="loading-dots"><span></span><span></span><span></span></div></div>
      </div>
      <!-- 月度统计 -->
      <div class="cal-stats" id="cal-stats"></div>
      <!-- 本月模考 -->
      <div class="cal-mocks" id="cal-mocks" style="display:none;"></div>

      <!-- 本月目标（集成在日历卡片内） -->
      <div class="month-goals-inline" id="month-goals-inline">
        <div class="goals-inline-header">
          <span class="goals-inline-title">🎯 本月目标</span>
          <span class="goals-inline-hint text-dim">双击编辑 · 回车保存</span>
        </div>
        <div id="goals-inline-list"></div>
        <div class="goal-input-row-inline">
          <input type="text" id="goal-input-inline" placeholder="输入一个大主题目标…" maxlength="60">
          <button class="btn-goal-add-inline" id="btn-goal-add-inline" onclick="addGoalInline()">+</button>
        </div>
        <p class="text-dim" style="font-size:0.68rem;margin-top:4px;">最多3个，聚焦比数量重要</p>
      </div>
    </div>

    <!-- 月度AI复盘 -->
    <div class="card animate-in animate-delay-2">
      <div class="card-title">🔍 月度AI复盘</div>
      <div class="monthly-review-section">
        <div class="monthly-review-controls">
          <select id="review-month" class="review-month-select"></select>
          <button class="btn-review-generate" id="btn-generate-review" onclick="generateMonthlyReview()">
            ✨ 生成本月复盘
          </button>
        </div>
        <div class="review-result" id="review-result">
          <p class="text-dim" style="font-size:0.85rem;">选择月份并点击生成，AI会为你分析当月学习情况</p>
        </div>
      </div>
    </div>
  </div>

  <!-- 底部导航 - 4 tab -->
  <nav class="bottom-nav">
    <a href="/" class="nav-item">
      <svg class="nav-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 18c2.5-1.5 5-1.5 9-1.5s6.5 0 9 1.5"/>
        <path d="M12 3v13.5"/>
        <path d="M5 15c0-4 3-8 7-12 4 4 7 8 7 12"/>
      </svg>
      <span class="nav-label">航海</span>
    </a>
    <a href="/log" class="nav-item">
      <svg class="nav-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round">
        <path d="M17 3c-2 1-4 3-5 6l-3 8 8-3c3-1 5-3 6-5"/>
        <path d="M9 17l-3 3"/>
        <path d="M14 8c1-1 2.5-1.5 4-1"/>
      </svg>
      <span class="nav-label">日志</span>
    </a>
    <a href="/route" class="nav-item">
      <svg class="nav-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="9"/>
        <polygon points="12,3 13.5,10.5 12,8 10.5,10.5" fill="currentColor" opacity="0.6"/>
        <polygon points="12,21 10.5,13.5 12,16 13.5,13.5" fill="currentColor" opacity="0.3"/>
        <line x1="12" y1="3" x2="12" y2="5"/>
        <line x1="12" y1="19" x2="12" y2="21"/>
        <line x1="3" y1="12" x2="5" y2="12"/>
        <line x1="19" y1="12" x2="21" y2="12"/>
      </svg>
      <span class="nav-label">航线</span>
    </a>
    <a href="/review" class="nav-item active">
      <svg class="nav-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 19l7-7 3 3-7 7-3-3z"/>
        <path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18"/>
        <path d="M2 2l7.586 7.586"/>
        <circle cx="11" cy="11" r="2"/>
      </svg>
      <span class="nav-label">复盘</span>
    </a>
  </nav>

  <!-- Toast -->
  <div id="toast" class="toast"></div>

  <script>
    // ====== 全局变量 ======
    const now = new Date();
    let calYear = now.getFullYear();
    let calMonth = now.getMonth(); // 0-indexed

    // ====== 月份选择器初始化 ======
    (function initMonthSelect() {
      const monthSelect = document.getElementById('review-month');
      for (let i = 0; i < 12; i++) {
        const m = i + 1;
        const opt = document.createElement('option');
        opt.value = `${now.getFullYear()}-${String(m).padStart(2, '0')}`;
        opt.textContent = `${now.getFullYear()}年${m}月`;
        if (m === now.getMonth() + 1) opt.selected = true;
        monthSelect.appendChild(opt);
      }
    })();

    // ====== 月份切换 ======
    function changeMonth(delta) {
      calMonth += delta;
      if (calMonth > 11) { calMonth = 0; calYear++; }
      if (calMonth < 0) { calMonth = 11; calYear--; }
      loadCalendar(calYear, calMonth);
    }

    // ====== 日历加载 ======
    async function loadCalendar(year, month) {
      const ym = `${year}-${String(month + 1).padStart(2, '0')}`;
      const monthNames = ['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'];
      document.getElementById('cal-title').textContent = `${year}年${monthNames[month]}`;

      const grid = document.getElementById('cal-grid');
      grid.innerHTML = '<div class="loading"><div class="loading-dots"><span></span><span></span><span></span></div></div>';

      try {
        // 加时间戳避免缓存
        const res = await fetch(`/api/monthly-calendar?month=${ym}&_t=${Date.now()}`);
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const data = await res.json();
        if (data && data.days) {
          renderCalendar(year, month, data.days, data.scores || []);
        } else {
          // 没有数据也正常渲染空日历
          renderCalendar(year, month, {}, []);
        }
      } catch (err) {
        console.error('Calendar load error:', err);
        // 即使API失败，也渲染空日历而不是报错
        renderCalendar(year, month, {}, []);
      }

      // 切换月份后加载目标
      loadGoalsInline();
    }

    // ====== 日历渲染 ======
    function renderCalendar(year, month, days, scores) {
      const grid = document.getElementById('cal-grid');
      grid.innerHTML = '';

      const firstDay = new Date(year, month, 1);
      let firstWeekday = firstDay.getDay() - 1;
      if (firstWeekday < 0) firstWeekday = 6;
      const daysInMonth = new Date(year, month + 1, 0).getDate();

      const allHours = Object.values(days).map(function(d) { return d.total_hours || 0; });
      const maxHours = allHours.length ? Math.max.apply(null, allHours) : 1;

      let totalStudyDays = 0;
      let totalHours = 0;

      // 空白填充
      for (let i = 0; i < firstWeekday; i++) {
        const empty = document.createElement('div');
        empty.className = 'cal-cell cal-empty';
        grid.appendChild(empty);
      }

      // 每天格子
      for (let d = 1; d <= daysInMonth; d++) {
        const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
        const dayData = days[dateStr];
        const cell = document.createElement('div');
        cell.className = 'cal-cell';

        const isToday = (d === now.getDate() && month === now.getMonth() && year === now.getFullYear());
        if (isToday) cell.classList.add('cal-today');

        const dateNum = document.createElement('span');
        dateNum.className = 'cal-date-num';
        dateNum.textContent = d;
        cell.appendChild(dateNum);

        if (dayData) {
          totalStudyDays++;
          totalHours += (dayData.total_hours || 0);

          const intensity = (dayData.total_hours || 0) / maxHours;
          cell.classList.add('cal-has-data');
          cell.style.background = `rgba(212, 165, 116, ${0.05 + intensity * 0.25})`;

          const hoursLabel = document.createElement('span');
          hoursLabel.className = 'cal-hours';
          hoursLabel.textContent = `${dayData.total_hours}h`;
          cell.appendChild(hoursLabel);

          const subjList = dayData.subjects || [];
          const subjNames = [];
          const seen = {};
          for (let s = 0; s < subjList.length; s++) {
            const name = subjList[s].subject;
            if (!seen[name]) { seen[name] = true; subjNames.push(name); }
          }
          if (subjNames.length) {
            const subjLabel = document.createElement('span');
            subjLabel.className = 'cal-subj';
            subjLabel.textContent = subjNames.slice(0, 2).join(' ');
            cell.appendChild(subjLabel);
          }

          if (dayData.mood) {
            const moodEl = document.createElement('span');
            moodEl.className = 'cal-mood';
            moodEl.textContent = dayData.mood;
            cell.appendChild(moodEl);
          }
        } else {
          const todayStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')}`;
          if (dateStr <= todayStr && !(year > now.getFullYear() || (year === now.getFullYear() && month > now.getMonth()))) {
            cell.style.opacity = '0.3';
          }
        }

        grid.appendChild(cell);
      }

      // 统计
      const weekGoal = 30;
      const monthGoal = weekGoal * 4.3;
      const statsEl = document.getElementById('cal-stats');
      statsEl.innerHTML = '<span>学习 <strong style="color:var(--gold-bright)">' + totalStudyDays + '</strong> 天</span>' +
        '<span>累计 <strong style="color:var(--gold-bright)">' + totalHours.toFixed(1) + '</strong> 小时</span>' +
        '<span>目标进度 <strong style="color:' + (totalHours >= monthGoal * 0.7 ? 'var(--gold-bright)' : 'var(--text-dim)') + '">' + Math.round(totalHours / monthGoal * 100) + '%</strong></span>';

      // 模考
      const mocksEl = document.getElementById('cal-mocks');
      if (scores && scores.length) {
        mocksEl.style.display = 'block';
        let html = '<div class="card-title" style="font-size:0.85rem;margin-bottom:8px;"> 本月模考</div>';
        for (let i = 0; i < scores.length; i++) {
          const s = scores[i];
          const scoreDisplay = s.max_score ? (s.score + '/' + s.max_score) : s.score;
          html += '<div class="cal-mock-item"><span>' + s.date.slice(5) + ' ' + s.subject + '</span>' +
            '<span class="cal-mock-score">' + scoreDisplay + '分</span>' +
            (s.exam_name ? '<span class="cal-mock-exam">' + s.exam_name + '</span>' : '') + '</div>';
        }
        mocksEl.innerHTML = html;
      } else {
        mocksEl.style.display = 'none';
      }
    }

    // ====== 月度目标（集成日历内 + 双击编辑） ======
    function getGoalKey() {
      return `${calYear}-${String(calMonth + 1).padStart(2, '0')}`;
    }

    function loadGoalsInline() {
      const key = getGoalKey();
      let goals = [];
      try {
        const stored = localStorage.getItem('monthly_goals_' + key);
        goals = stored ? JSON.parse(stored) : [];
      } catch (e) { goals = []; }
      renderGoalsInline(goals);
    }

    function saveGoalsInline(goals) {
      const key = getGoalKey();
      localStorage.setItem('monthly_goals_' + key, JSON.stringify(goals));
    }

    function renderGoalsInline(goals) {
      const list = document.getElementById('goals-inline-list');
      list.innerHTML = '';

      if (!goals || goals.length === 0) {
        list.innerHTML = '<p class="text-dim" style="font-size:0.78rem;padding:6px 0;">还没有设定本月目标，输入一个开始吧</p>';
      } else {
        goals.forEach(function(g, i) {
          const el = document.createElement('div');
          el.className = 'goal-item-inline';
          el.setAttribute('data-index', i);

          // 文本显示（双击编辑）
          const textSpan = document.createElement('span');
          textSpan.className = 'goal-text-inline';
          textSpan.textContent = g;
          textSpan.addEventListener('dblclick', function() { startEditGoal(i, el, textSpan); });

          // 删除按钮
          const delBtn = document.createElement('span');
          delBtn.className = 'goal-delete-inline';
          delBtn.textContent = '✕';
          delBtn.addEventListener('click', function() { removeGoalInline(i); });

          el.appendChild(textSpan);
          el.appendChild(delBtn);
          list.appendChild(el);
        });
      }

      // 更新输入框状态
      const input = document.getElementById('goal-input-inline');
      const btn = document.getElementById('btn-goal-add-inline');
      if (goals.length >= 3) {
        input.disabled = true;
        input.placeholder = '已达上限（3个）';
        btn.disabled = true;
      } else {
        input.disabled = false;
        input.placeholder = '输入一个大主题目标…';
        btn.disabled = false;
      }
    }

    // 双击开始编辑
    function startEditGoal(index, el, textSpan) {
      if (el.querySelector('.goal-edit-input')) return; // 已在编辑中

      const currentText = textSpan.textContent;
      const input = document.createElement('input');
      input.type = 'text';
      input.className = 'goal-edit-input';
      input.value = currentText;
      input.maxLength = 60;

      textSpan.style.display = 'none';
      el.insertBefore(input, textSpan.nextSibling);
      input.focus();
      input.select();

      function saveEdit() {
        const newText = input.value.trim();
        if (newText && newText !== currentText) {
          const key = getGoalKey();
          let goals = JSON.parse(localStorage.getItem('monthly_goals_' + key) || '[]');
          goals[index] = newText;
          saveGoalsInline(goals);
        }
        renderGoalsInline(getGoalsFromStorage());
      }

      input.addEventListener('keydown', function(e) {
        if (e.key === 'Enter') { e.preventDefault(); saveEdit(); }
        if (e.key === 'Escape') { renderGoalsInline(getGoalsFromStorage()); }
      });
      input.addEventListener('blur', saveEdit);
    }

    function getGoalsFromStorage() {
      const key = getGoalKey();
      try { return JSON.parse(localStorage.getItem('monthly_goals_' + key) || '[]'); }
      catch (e) { return []; }
    }

    function addGoalInline() {
      const input = document.getElementById('goal-input-inline');
      const text = input.value.trim();
      if (!text) return;
      const goals = getGoalsFromStorage();
      if (goals.length >= 3) return;
      goals.push(text);
      saveGoalsInline(goals);
      input.value = '';
      renderGoalsInline(goals);
    }

    function removeGoalInline(index) {
      const goals = getGoalsFromStorage();
      goals.splice(index, 1);
      saveGoalsInline(goals);
      renderGoalsInline(goals);
    }

    // 回车添加
    document.getElementById('goal-input-inline').addEventListener('keydown', function(e) {
      if (e.key === 'Enter') { e.preventDefault(); addGoalInline(); }
    });

    // ====== 月度AI复盘 ======
    async function generateMonthlyReview() {
      const month = document.getElementById('review-month').value;
      const btn = document.getElementById('btn-generate-review');
      const resultEl = document.getElementById('review-result');

      btn.disabled = true;
      btn.textContent = '生成中...';
      resultEl.innerHTML = '<div class="loading"><div class="loading-dots"><span></span><span></span><span></span></div></div>';

      try {
        const res = await fetch('/api/monthly-review', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ month }),
        });
        const data = await res.json();
        const r = JSON.parse(data.review);
        resultEl.innerHTML = renderReview(r);
      } catch (err) {
        resultEl.innerHTML = '<p class="text-dim" style="font-size:0.85rem;color:var(--danger)">生成失败，请重试</p>';
      } finally {
        btn.disabled = false;
        btn.textContent = '✨ 生成本月复盘';
      }
    }

    function renderReview(r) {
      let html = '<div class="review-card">';
      html += '<div class="review-card-header">';
      html += '<span class="review-mood">' + (r.mood || '') + '</span>';
      html += '<span class="review-title">' + (r.title || '') + '</span>';
      html += '</div>';
      if (r.summary) {
        html += '<p class="review-summary">' + r.summary + '</p>';
      }
      if (r.highlights && r.highlights.length) {
        html += '<div class="review-section"><div class="review-section-title">✨ 亮点</div><ul>';
        r.highlights.forEach(function(h) { html += '<li>' + h + '</li>'; });
        html += '</ul></div>';
      }
      if (r.improvements && r.improvements.length) {
        html += '<div class="review-section"><div class="review-section-title">📌 建议</div><ul>';
        r.improvements.forEach(function(s) { html += '<li>' + s + '</li>'; });
        html += '</ul></div>';
      }
      if (r.next_month) {
        html += '<div class="review-next">→ ' + r.next_month + '</div>';
      }
      html += '</div>';
      return html;
    }

    // ====== 初始加载 ======
    loadCalendar(calYear, calMonth);

    // ====== Service Worker ======
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/static/sw.js').then(function(reg) {
        console.log('SW registered, scope:', reg.scope);
      }).catch(function(err) {
        console.error('SW register failed:', err);
      });
    }
  </script>
</body>
</html>
